name: research-feeds
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      AIRTABLE_WORKSPACE_ID: ${{ secrets.AIRTABLE_WORKSPACE_ID }}
      SCREENER_API_KEY: ${{ secrets.SCREENER_API_KEY }}
      SCREENER_PROVIDER: anthropic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restore normalized DB (for change detection across runs)
        uses: actions/cache@v4
        with: { path: data/qr_research.sqlite, key: qr-db-${{ github.run_id }}, restore-keys: qr-db- }
      - run: make fetch
      - run: make candidates
      - run: make screen
      - run: make deliver
      - run: make health          # exits non-zero if any source is not "ok" → the run fails loudly
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: research-feeds-run, path: "examples/*.json\ndata/raw/**" }
